name: Redlines

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/redline-requirements.txt
      - run: python -X utf8 scripts/check_redlines.py
      - run: python -X utf8 -m unittest discover -s scripts -p test_redlines.py -v
