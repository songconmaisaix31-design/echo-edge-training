name: Checks

# 后端 Lint / 导入约束 / 类型基线，以及前端的类型、Lint 与构建。
# 公开文本红线在 redlines.yml，两者独立。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r scripts/lint-requirements.txt
      - name: Ruff
        run: python -m ruff check backend
      - name: Import contracts
        run: python -X utf8 scripts/check_imports.py
      - name: Pyright baseline
        run: python -X utf8 scripts/check_pyright.py

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # typecheck 会用 FastAPI 的 OpenAPI 文档核对生成类型，所以要装后端依赖。
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Install backend dependencies for the OpenAPI dump
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
