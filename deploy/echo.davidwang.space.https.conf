server {
    listen 80;
    listen [::]:80;
    server_name echo.davidwang.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name echo.davidwang.space;
    ssl_certificate /etc/letsencrypt/live/echo.davidwang.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/echo.davidwang.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/echo-edge/src/frontend/dist;
    index index.html;
    client_max_body_size 70m;
    client_body_timeout 180s;
    gzip on;
    gzip_types application/javascript text/css application/json;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:8036;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff;
    }
}
